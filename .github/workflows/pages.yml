name: GitHub Pages deployen

on:
  push:
    branches:
      - main
      - claude/create-clearway-repo-1n3tfo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: clearway
      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
