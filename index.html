<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Referenzen</title>
<meta name="description" content="Deine Sammlung inspirierender Websites – Link, Hero-Screenshot und Notiz." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Referenzen" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Referenzen</h1>
      <span class="count" id="count"></span>
    </div>

    <div class="topbar-actions">
      <div class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1a6 6 0 1 0 3.68 10.74l3.29 3.29a.75.75 0 1 0 1.06-1.06l-3.29-3.29A6 6 0 0 0 7 1ZM2.5 7a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z"/></svg>
        <input id="search" type="search" placeholder="Suchen" autocomplete="off" spellcheck="false" />
      </div>
      <button class="btn btn-primary" id="openAdd">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a.9.9 0 0 1 .9.9v3.7h3.7a.9.9 0 0 1 0 1.8H8.9v3.7a.9.9 0 0 1-1.8 0V8.9H3.4a.9.9 0 0 1 0-1.8h3.7V3.4a.9.9 0 0 1 .9-.9Z"/></svg>
        <span>Hinzufügen</span>
      </button>
      <button class="btn btn-ghost icon-only" id="openMenu" aria-label="Weitere Optionen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.4a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Zm0 5a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Zm0 5a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"/></svg>
      </button>
    </div>
  </div>

  <div class="filterbar" id="filterbar" hidden>
    <div class="tagscroll" id="tagfilters"></div>
  </div>
</header>

<main>
  <section class="empty" id="empty" hidden>
    <div class="empty-art" aria-hidden="true"></div>
    <h2>Noch keine Referenz</h2>
    <p>Füge eine Website hinzu, die dich inspiriert – Link, ein Screenshot vom Hero-Bereich und eine kurze Notiz.</p>
    <button class="btn btn-primary" id="emptyAdd">Erste Referenz hinzufügen</button>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<!-- Add / Edit sheet -->
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <button class="btn btn-plain" id="cancelBtn">Abbrechen</button>
    <h2 id="sheetTitle">Neue Referenz</h2>
    <button class="btn btn-plain strong" id="saveBtn">Sichern</button>
  </div>

  <div class="sheet-body">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Screenshot auswählen">
      <img id="preview" alt="" hidden />
      <div class="dropzone-hint" id="dropHint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a1 1 0 0 1 .7.3l4 4a1 1 0 0 1-1.4 1.4L13 7.4V15a1 1 0 1 1-2 0V7.4L8.7 9.7a1 1 0 0 1-1.4-1.4l4-4A1 1 0 0 1 12 4Zm-7 12a1 1 0 0 1 1 1v1.5c0 .3.2.5.5.5h11c.3 0 .5-.2.5-.5V17a1 1 0 1 1 2 0v1.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5V17a1 1 0 0 1 1-1Z"/></svg>
        <strong>Hero-Screenshot</strong>
        <span>Ziehen, einfügen (⌘V) oder tippen</span>
      </div>
      <button class="chip-remove" id="removeImg" hidden aria-label="Bild entfernen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.3 4.3a.9.9 0 0 1 1.3 0L8 6.7l2.4-2.4a.9.9 0 1 1 1.3 1.3L9.3 8l2.4 2.4a.9.9 0 0 1-1.3 1.3L8 9.3l-2.4 2.4a.9.9 0 0 1-1.3-1.3L6.7 8 4.3 5.6a.9.9 0 0 1 0-1.3Z"/></svg>
      </button>
      <input type="file" id="file" accept="image/*" hidden />
    </div>

    <div class="field">
      <label for="url">Link</label>
      <input id="url" type="url" inputmode="url" placeholder="https://beispiel.de" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <label for="title">Titel</label>
      <input id="title" type="text" placeholder="Wird automatisch aus dem Link erzeugt" autocomplete="off" />
    </div>

    <div class="field">
      <label for="note">Beschreibung</label>
      <textarea id="note" rows="3" placeholder="Was gefällt dir? z. B. „Ruhiges Grid, starke Typo, feine Scroll-Animationen“"></textarea>
    </div>

    <div class="field">
      <label for="tags">Tags</label>
      <input id="tags" type="text" placeholder="Typografie, Dark Mode, Portfolio" autocomplete="off" />
      <p class="hint">Mit Komma trennen</p>
    </div>

    <button class="btn btn-danger-plain" id="deleteBtn" hidden>Referenz löschen</button>
  </div>
</section>

<!-- Options menu -->
<section class="menu" id="menu" hidden role="menu" aria-label="Optionen">
  <button role="menuitem" data-sort="new">Neueste zuerst</button>
  <button role="menuitem" data-sort="old">Älteste zuerst</button>
  <button role="menuitem" data-sort="az">Nach Titel (A–Z)</button>
  <hr />
  <button role="menuitem" id="exportBtn">Backup exportieren</button>
  <button role="menuitem" id="importBtn">Backup importieren</button>
  <input type="file" id="importFile" accept="application/json" hidden />
</section>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
